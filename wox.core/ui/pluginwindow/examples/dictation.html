<!doctype html>
<html lang="en">
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; font: 16px system-ui; }
  body { margin: 16px; }
  header { display: flex; align-items: center; gap: 12px; }
  #indicator { width: 12px; height: 12px; background: #e64949; border-radius: 50%; animation: pulse 1s infinite alternate; }
  #transcript { white-space: pre-wrap; overflow-wrap: anywhere; }
  button { margin-left: auto; font: inherit; padding: 6px 12px; }
  @keyframes pulse { to { opacity: .35; } }
</style>
<header><span id="indicator"></span><span id="status">Listening</span><button id="cancel">Cancel</button></header>
<p id="transcript"></p>
<script>
  woxWindow.onMessage(state => {
    if (typeof state.text === "string") document.querySelector("#transcript").textContent = state.text
    if (typeof state.status === "string") document.querySelector("#status").textContent = state.status
    if (typeof state.recording === "boolean") document.querySelector("#indicator").style.animationPlayState = state.recording ? "running" : "paused"
  })
  document.querySelector("#cancel").onclick = () => woxWindow.postMessage({ action: "cancel" })
</script>
</html>
