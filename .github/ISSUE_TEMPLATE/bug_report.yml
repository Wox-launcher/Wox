name: Bug report
description: Create a report to help us improve
title: "[Bug]: "
labels: []
assignees:
  - qianlifeng

body:
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Enter your operating system.
      placeholder: macOS, Windows, or Linux
    validations:
      required: true

  - type: input
    id: linux_environment
    attributes:
      label: Linux Environment
      description: Optional. Linux users can enter their desktop environment and display server; otherwise leave blank.
      placeholder: GNOME / Wayland, KDE Plasma / X11 (Xorg), etc.
    validations:
      required: false

  - type: input
    id: wox_version
    attributes:
      label: Wox Version
      description: In Wox, type `copy version` to copy the current version. You can also find it in Settings -> About.
      placeholder: 2.4.4
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: What happened? What did you expect?
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### Logs
        Please upload the Wox log to help identify your bug.
        Attach the log file in the **Description** editor area where GitHub shows:
        `Paste, drop, or click to add files`

        In Wox, type `feedback` to export diagnostics or open the current log.
        For a clean reproduction, choose **Clear logs** first, reproduce the issue, then **Export diagnostics**.
        Crash reports are listed under `feedback crash`.
