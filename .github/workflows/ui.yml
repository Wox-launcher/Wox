name: UI Quality

on:
  pull_request:
    paths:
      - ".github/workflows/ui.yml"
      - "Makefile"
      - "wox.core/appcontrol/**"
      - "wox.core/common/**"
      - "wox.core/main.go"
      - "wox.core/plugin/system/shell/terminal/**"
      - "wox.core/ui/**"
      - "wox.core/test/automationdriver/**"
      - "wox.core/test/smoke/**"
      - "wox.core/test/smokerunner/**"
      - "wox.plugin.host.nodejs/**"
      - "wox.plugin.host.python/**"
      - "wox.plugin.nodejs/**"
      - "wox.plugin.python/**"
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Widget and automation contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libsecret-1-dev \
            libx11-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxtst-dev \
            libkeybinder-3.0-dev \
            libpipewire-0.3-dev
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: wox.core/go.mod
          cache: false
      - name: Test UI contracts
        run: make test-go-ui-unit

  native-compile-pr:
    name: Native UI compile (${{ matrix.name }})
    if: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: wox.core/go.mod
          cache: false
      - name: Compile native UI packages
        shell: bash
        working-directory: wox.core
        run: go test ./ui/runtime ./ui/widget ./ui/launcher -run TestDoesNotExist

  native-smoke-pr:
    name: Native launcher smoke (Linux)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libsecret-1-dev \
            libx11-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxtst-dev \
            libkeybinder-3.0-dev \
            libpipewire-0.3-dev \
            xclip \
            xvfb
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: wox.core/go.mod
          cache: false
      # Host binaries are gitignored and embedded into the smoke build, so CI
      # must produce python-host.pyz and node-host.js before make smoke.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
      - name: Build plugin hosts
        run: make host
      - name: Run native smoke
        env:
          GO_UI_SMOKE_RUNNER: xvfb-run -a
          WOX_PERF_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/perf
          WOX_SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/smoke
        run: make smoke
      - name: Upload Linux perf artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-perf-linux-pr
          path: artifacts/perf/
          if-no-files-found: ignore
      # The suite directory is only retained on failure and holds the Wox data,
      # logs, and settings needed to diagnose a stuck smoke wait.
      - name: Upload Linux smoke failure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke-failure-linux-pr
          path: artifacts/smoke/
          if-no-files-found: ignore

  native-smoke-daily:
    name: Native launcher smoke (${{ matrix.name }})
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            runner: xvfb-run -a
          - name: macOS
            os: macos-latest
            runner: ""
          - name: Windows
            os: windows-latest
            runner: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux UI dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libsecret-1-dev \
            libx11-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxtst-dev \
            libkeybinder-3.0-dev \
            libpipewire-0.3-dev \
            xclip \
            xvfb
      - name: Install make on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: choco install -y make
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: wox.core/go.mod
          cache: false
      # Host binaries are gitignored and embedded into the smoke build, so CI
      # must produce python-host.pyz and node-host.js before make smoke.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
      - name: Build plugin hosts
        shell: bash
        run: make host
      - name: Run native smoke
        shell: bash
        env:
          GO_UI_SMOKE_RUNNER: ${{ matrix.runner }}
          WOX_PERF_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/perf
          WOX_SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/smoke
        run: make smoke
      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-perf-${{ matrix.name }}
          path: artifacts/perf/
          if-no-files-found: ignore
      # The suite directory is only retained on failure and holds the Wox data,
      # logs, and settings needed to diagnose a stuck smoke wait.
      - name: Upload smoke failure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke-failure-${{ matrix.name }}
          path: artifacts/smoke/
          if-no-files-found: ignore
