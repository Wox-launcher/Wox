name: Plugin health

on:
  schedule:
    - cron: "27 2 * * *"
  workflow_dispatch:
    inputs:
      plugin:
        description: "Optional plugin id or name; leave empty to check every store plugin"
        required: false
        type: string

permissions:
  contents: read

jobs:
  plugin-health:
    name: Store plugin health (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            runner: xvfb-run -a
          - name: macOS
            os: macos-latest
            runner: ""
          - name: Windows
            os: windows-latest
            runner: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux UI dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libsecret-1-dev \
            libx11-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxtst-dev \
            libkeybinder-3.0-dev \
            libpipewire-0.3-dev \
            xvfb

      - name: Install make on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: choco install -y make

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: wox.core/go.mod
          cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false

      - name: Build plugin hosts
        shell: bash
        run: make host

      - name: Check store plugins
        shell: bash
        env:
          PLUGIN: ${{ inputs.plugin }}
          OUT: plugin-health.json
        run: ${{ matrix.runner }} make plugin-health

      - name: Upload plugin health report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-health-${{ matrix.name }}
          path: plugin-health.json
          if-no-files-found: ignore
