name: Sync plugin stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-stats
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Test plugin stats sync
        run: node --test ci/sync-plugin-stats.test.mjs
      - name: Sync plugin stats
        run: node ci/sync-plugin-stats.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit updated catalog
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- store-plugin.json; then
            echo "Plugin statistics are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store-plugin.json
          git commit -m "[Bot] Update plugin store statistics"
          git push origin "HEAD:$DEFAULT_BRANCH"
